      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /notifications Resource
  NotificationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: notifications

  # /notifications/preferences Resource
  NotificationsPreferencesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !Ref NotificationsResource
      PathPart: preferences

  # GET /notifications/preferences
  NotificationsPreferencesGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref NotificationsPreferencesResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NotificationPreferencesLambdaArn}/invocations'

  # PUT /notifications/preferences
  NotificationsPreferencesPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref NotificationsPreferencesResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NotificationPreferencesLambdaArn}/invocations'

  # OPTIONS /notifications/preferences (CORS)
  NotificationsPreferencesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
