            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda Permission for Analytics
  AnalyticsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyticsLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SkillDecayAPI}/*'

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'
  
  ApiId:
    Description: API Gateway ID
    Value: !Ref SkillDecayAPI
  
  UsersEndpoint:
    Description: POST /users endpoint
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/users'
  
  SkillsEndpoint:
    Description: Skills endpoint (GET/POST/PUT/DELETE)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/skills'
  
  PracticeEndpoint:
    Description: POST /practice endpoint (AI exercise generation)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/practice'
  
  PracticeSessionEndpoint:
    Description: POST /practice-session endpoint (record score)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/practice-session'

  AnalyticsEndpoint:
    Description: Analytics endpoint URL
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/analytics'

  NotificationPreferencesEndpoint:
    Description: Notification preferences endpoint (GET/PUT)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/notifications/preferences'

  NotificationsEndpoint:
    Description: Notifications list endpoint (GET)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/notifications'

  NotificationsReadEndpoint:
    Description: Mark notifications read endpoint (PUT)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/notifications/read'