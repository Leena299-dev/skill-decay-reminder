    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref NotificationsReadResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NotificationReaderLambdaArn}/invocations'

  # OPTIONS /notifications/read (CORS)
  NotificationsReadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref NotificationsReadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
