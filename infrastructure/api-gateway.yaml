AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway REST API for Skill Decay Reminder application

Parameters:
  UserRegistrationLambdaArn:
    Type: String
    Description: ARN of the UserRegistration Lambda function
  SkillManagerLambdaArn:
    Type: String
    Description: ARN of the SkillManager Lambda function

Resources:
  SkillDecayAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: SkillDecayReminderAPI
      Description: REST API for Skill Decay Reminder application

  # /users resource
  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: users

  # POST /users
  UsersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref UsersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserRegistrationLambdaArn}/invocations'

  # OPTIONS /users (CORS preflight)
  UsersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref UsersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /skills resource
  SkillsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: skills

  # POST /skills
  SkillsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # GET /skills
  SkillsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # PUT /skills
  SkillsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # DELETE /skills
  SkillsDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # OPTIONS /skills (CORS preflight)
  SkillsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda permissions
  UserRegistrationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserRegistrationLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SkillDecayAPI}/*/POST/users'

  SkillManagerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SkillManagerLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SkillDecayAPI}/*/*/skills'

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UsersPostMethod
      - UsersOptionsMethod
      - SkillsPostMethod
      - SkillsGetMethod
      - SkillsPutMethod
      - SkillsDeleteMethod
      - SkillsOptionsMethod
    Properties:
      RestApiId: !Ref SkillDecayAPI
      StageName: prod

Outputs:
  ApiId:
    Description: API Gateway ID
    Value: !Ref SkillDecayAPI
  ApiRootUrl:
    Description: Root URL of the API
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'
  UsersEndpoint:
    Description: POST /users endpoint
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/users'
  SkillsEndpoint:
    Description: /skills endpoint (GET, POST, PUT, DELETE)
    Value: !Sub 'https://${SkillDecayAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/skills'
