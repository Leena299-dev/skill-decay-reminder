AWSTemplateFormatVersion: '2010-09-09'
Description: 'API Gateway for Skill Decay Reminder - Complete with 7 endpoints'

Parameters:
  UserRegistrationLambdaArn:
    Type: String
    Description: ARN of UserRegistration Lambda function
  
  SkillManagerLambdaArn:
    Type: String
    Description: ARN of SkillManager Lambda function
  
  PracticeGeneratorLambdaArn:
    Type: String
    Description: ARN of PracticeGenerator Lambda function
  
  PracticeSessionLambdaArn:
    Type: String
    Description: ARN of PracticeSession Lambda function

  AnalyticsLambdaArn:
    Type: String

  NotificationPreferencesLambdaArn:
    Type: String
    Description: ARN of NotificationPreferences Lambda function

  NotificationReaderLambdaArn:
    Type: String
    Description: ARN of NotificationReader Lambda function (GET /notifications, PUT /notifications/read)

Resources:
  # REST API
  SkillDecayAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: SkillDecayReminderAPI
      Description: REST API for Skill Decay Reminder application
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /users Resource
  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: users

  # POST /users Method
  UsersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref UsersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserRegistrationLambdaArn}/invocations'

  # GET /users Method (sign-in: look up userId by email)
  UsersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref UsersResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserRegistrationLambdaArn}/invocations'

  # OPTIONS /users (CORS)
  UsersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref UsersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /skills Resource
  SkillsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: skills

  # POST /skills Method
  SkillsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # GET /skills Method
  SkillsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # PUT /skills Method
  SkillsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref SkillsResource
      HttpMethod: PUT
      AuthorizationType: NONE
