        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SkillManagerLambdaArn}/invocations'

  # DELETE /skills Method
  SkillsDeleteMethod:
