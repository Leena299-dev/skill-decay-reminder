    DependsOn:
      - UsersGetMethod
      - UsersPostMethod
      - UsersOptionsMethod
      - SkillsPostMethod
      - SkillsGetMethod
      - SkillsPutMethod
      - SkillsDeleteMethod
      - SkillsOptionsMethod
      - PracticePostMethod
      - PracticeOptionsMethod
      - PracticeSessionPostMethod
      - PracticeSessionOptionsMethod
      - AnalyticsGetMethod
      - NotificationsPreferencesGetMethod
      - NotificationsPreferencesPutMethod
      - NotificationsPreferencesOptionsMethod
      - NotificationsGetMethod
      - NotificationsOptionsMethod
      - NotificationsReadPutMethod
      - NotificationsReadOptionsMethod
    Properties:
      RestApiId: !Ref SkillDecayAPI
      StageName: prod

# Analytics Resource
  AnalyticsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ParentId: !GetAtt SkillDecayAPI.RootResourceId
      PathPart: analytics

  # Analytics GET Method
  AnalyticsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref AnalyticsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyticsLambdaArn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # Analytics OPTIONS Method (CORS)
  AnalyticsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref AnalyticsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
