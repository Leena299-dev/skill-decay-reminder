        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PracticeSessionLambdaArn}/invocations'

  # OPTIONS /practice-session (CORS)
  PracticeSessionOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SkillDecayAPI
      ResourceId: !Ref PracticeSessionResource
      HttpMethod: OPTIONS
